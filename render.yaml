services:
  - type: web
    name: citizavrexo
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: npm ci && STORAGE_MODE=persistent DATABASE_URL=file:./data/build.db PROFILE_IMAGE_DIR=./data/profile-images npm run build
    startCommand: npm run start:free
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: STORAGE_MODE
        value: ephemeral
      - key: DATABASE_URL
        value: file:/tmp/citizavrexo/Citizavrexo.db
      - key: PROFILE_IMAGE_DIR
        value: /tmp/citizavrexo/profile-images
      - key: RECOVERY_CODE_PEPPER
        sync: false
      - key: EPHEMERAL_ADMIN_EMAIL
        sync: false
      - key: EPHEMERAL_ADMIN_NAME
        sync: false
      - key: EPHEMERAL_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: CUSTOMER_SERVICE_EMAIL
        sync: false
      - key: EXCHANGE_RATE_PROVIDER
        value: open_exchange_rates
      - key: OPEN_EXCHANGE_RATES_APP_ID
        sync: false
      - key: EXCHANGE_RATE_TIMEOUT_MS
        value: 8000
      - key: EXCHANGE_RATE_MAX_AGE_SECONDS
        value: 21600
