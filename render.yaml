services:
  - type: web
    name: citizavrexo
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    buildCommand: npm ci && STORAGE_MODE=persistent DATABASE_URL=file:./data/build.db PROFILE_IMAGE_DIR=./data/profile-images npm run build
    startCommand: npm run start:production
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: citizavrexo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: STORAGE_MODE
        value: persistent
      - key: DATABASE_URL
        value: file:/var/data/citizavrexo.db
      - key: PROFILE_IMAGE_DIR
        value: /var/data/profile-images
      - key: RECOVERY_CODE_PEPPER
        sync: false
      - key: EPHEMERAL_ADMIN_EMAIL
        sync: false
      - key: EPHEMERAL_ADMIN_NAME
        sync: false
      - key: EPHEMERAL_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: CUSTOMER_SERVICE_EMAIL
        sync: false
      - key: EXCHANGE_RATE_PROVIDER
        value: open_exchange_rates
      - key: OPEN_EXCHANGE_RATES_APP_ID
        sync: false
      - key: EXCHANGE_RATE_TIMEOUT_MS
        value: 8000
      - key: EXCHANGE_RATE_MAX_AGE_SECONDS
        value: 21600
